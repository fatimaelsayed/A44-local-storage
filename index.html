<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student notes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>My Personal Notes</h1>
    
    <input type="text" id="title" placeholder="Enter your note title"> <br><br>
    <input type="text" id="notes" placeholder="Write your note"> <br><br>

    <div class="buttons">
        <input type="button" id="save" value="Save Note">
        <input type="button" id="display" value="Display Notes">
        <input type="button" id="clear" value="Clear note">
    </div>

    <h3 id="displaytitle"></h3>
    <p id="displaynotes"></p>

    <script src="script.js"></script>
</body>
</html>
